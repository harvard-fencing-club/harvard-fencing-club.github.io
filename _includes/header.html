  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode"><img src="assets/images/harvard-h-shield.png" alt="" width="510" height="629"></button>
        <a class="brand-name" href="./" aria-label="Harvard Fencing Club home"><span>Harvard Fencing Club</span></a>
      </div>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav" aria-label="Open navigation"><span></span><span></span></button>
      <nav class="main-nav" id="main-nav" aria-label="Main">
        {%- for item in site.nav %}
        <a href="{{ item.href }}"{% if page.nav == item.key %} aria-current="page"{% endif %}>{{ item.label }}</a>
        {%- endfor %}
      </nav>
    </div>
  </header>
