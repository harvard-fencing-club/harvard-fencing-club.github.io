# Jekyll settings. GitHub Pages builds the site from these files automatically.
title: Harvard Fencing Club
description: "All levels, all three weapons. Practice Tuesdays, Thursdays and Sundays at the MAC FR1!"
# Full address of the live site; link previews (WhatsApp, iMessage, etc.) need absolute URLs.
url: https://harvard-fencing-club.github.io

# Main navigation (header on every page). key matches each page's `nav:` front matter.
nav:
  - { key: home, label: Home, href: ./ }
  - { key: events, label: Events, href: events.html }
  - { key: team, label: Team, href: team.html }
  - { key: play, label: Play, href: play.html }
  - { key: donate, label: Donate, href: donate.html }
  - { key: resources, label: Resources, href: resources.html }

exclude:
  - README.md
  - CLAUDE.md
  - update-photos.py
